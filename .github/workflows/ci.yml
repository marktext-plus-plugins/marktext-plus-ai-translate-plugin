name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: It parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The editor's own repository runs this plugin for real — it checks this
      # one out and drives every command through the interpreter it ships. That
      # is the test that matters, and it is not here: it runs when somebody
      # pushes to the editor, which is not when somebody pushes to this.
      #
      # So this is the narrow half that belongs here: does what was just pushed
      # parse at all. A missing `end` is otherwise found by the next person to
      # touch a different repository.
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      # `loadfile` rather than `luac -p`: the interpreter is the one package
      # certainly present, and a syntax error makes it return nil and a message
      # rather than raise, which is what `assert` is here to turn into a
      # failure.
      - name: Every script parses
        run: |
          for file in $(find . -name '*.lua' -not -path './.git/*'); do
            echo "  $file"
            lua5.4 -e "local f, err = loadfile('$file'); assert(f, err)"
          done

      - name: The manifest is JSON, and says what it is
        run: |
          python3 - <<'PY'
          import json, sys
          with open('manifest.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          missing = [k for k in ('id', 'name', 'version', 'runtime')
                     if not manifest.get(k)]
          if missing:
              sys.exit(f'manifest.json is missing {missing}')
          entry = manifest.get('entrypoint')
          if manifest['runtime'] in ('lua', 'js') and not entry:
              sys.exit('a script plugin needs an entrypoint')
          print(f"{manifest['id']} {manifest['version']} ({manifest['runtime']})")
          PY

      - name: Every command the manifest declares is one the script answers
        run: |
          python3 - <<'PY'
          import json, re, sys

          manifest = json.load(open('manifest.json', encoding='utf-8'))
          declared = {
              item['id']
              for key in ('menus', 'panels', 'toolbar', 'commands')
              for item in (manifest.get(key) or [])
              if isinstance(item, dict) and item.get('id')
          }
          lua = open('plugin.lua', encoding='utf-8').read()
          answered = set(re.findall(r'command\s*[=~]=\s*"([^"]+)"', lua))

          # A reading that stops matching returns an empty set, and an empty set agrees
          # with anything. Say so instead of passing.
          if not declared:
              sys.exit('no ids found in the manifest; the reading has drifted')
          if not answered:
              sys.exit('no commands found in plugin.lua; the reading has drifted')

          unanswered = sorted(declared - answered)
          if unanswered:
              sys.exit('the manifest declares %s and plugin.lua never compares against '
                       'them — a menu item that does nothing, or does something else'
                       % unanswered)

          unreachable = sorted(answered - declared)
          if unreachable:
              sys.exit('plugin.lua handles %s and the manifest declares no such '
                       'command — the editor refuses what a plugin did not declare, so '
                       'that branch can never run' % unreachable)

          print('%d commands, declared and answered: %s'
                % (len(declared), ', '.join(sorted(declared))))
          PY
